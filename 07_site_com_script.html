<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML com Script</title>
</head>
<body>

    <h1>HTML com Script</h1>
    <p>Aplicando programação dentro do HTML</p>
    <button onclick="fazerSoverte()">Ver mensagem</button>

    <hr/>

    <p>Clique no botão</p>
    <button onclick="contarClicks()">Clique em mim</button>

    <script>

        let clicks = 0
        let dinheiro = 0
    
        function fazerSoverte(){
          dinheiro += 1
        }


        function contarClicks(){
            clicks = clicks + 1

            if (clicks > 10){
                alert("Você chegou no limite. Pare!")
                clicks = 0
            } else{
                alert("Você clicou " + clicks + " vezes.")
            }

        }
        

    </script>
    
</body>
</html>
